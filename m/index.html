<script>// Ядро калькулятора сбора (Квантовые вторжения). Работает и в браузере, и в node (для тестов).
(function (root) {
  const MOOD = [[0, 0.2, 'Восстание'], [0.21, 0.6, 'Непокорный'], [0.61, 0.8, 'Несчастный'], [0.81, 1.0, 'Нейтральный'],
    [1.21, 1.1, 'Содержание'], [1.41, 1.2, 'Счастье'], [2.0, 1.5, 'Энтузиаст']];

  function moodFactor(sup, dem) {
    if (dem <= 0) return 1.5;
    const r = sup / dem;
    let f = 0.2;
    for (const [t, v] of MOOD) if (r >= t - 1e-9) f = v;
    return f;
  }

  /**
   * p.houses: до 3 типов [{name, count, base, chrono, pop, boost, cost, refund}]
   * p.church: {euph, cost, refund, cells}
   * p.freeCells, p.houseCells (4), p.cityBoost (доля), p.formula 'add'|'mul'
   * p.minRatio — минимальное отношение эйфории к спросу перед финальным сбором (1.5 = 150%)
   * p.maxFactor — не подниматься выше этого множителя (1.2 = не идти в «Энтузиаст»)
   * p.rebuild — вычитать стоимость пересборки снесённых домов (цена − возврат)
   * p.chronoValue — сколько монет стоит 1 хроно (для выбора лучшего плана)
   * p.popFree — свободные жители (ограничивает снос домов), необязательно
   * p.supply0 — эйфория, которая уже есть (культура, декор), p.fixed — дома, которые не трогаем: {pop, boost, base, chrono}
   */
  function plan(p) {
    const H = p.houses.filter((h) => h.count > 0).map((h) => ({ ...h }));
    if (H.length > 3) throw new Error('Можно до 3 типов домов одновременно');
    while (H.length < 3) H.push({ name: '-', count: 0, base: 0, chrono: 0, pop: 0, boost: 0, cost: 0, refund: 0 });
    const ch = p.church;
    const W = p.chronoValue || 0;
    const F = p.fixed || { pop: 0, boost: 0, base: 0, chrono: 0 };
    const S0 = p.supply0 || 0;
    const n = H.map((h) => h.count);
    const N0 = n[0] + 1, N1 = n[1] + 1, N2 = n[2] + 1;
    const maxC = Math.floor((p.freeCells + p.houseCells * (n[0] + n[1] + n[2])) / ch.cells);
    const NC = maxC + 1;
    const size = N0 * N1 * N2 * NC;
    const idx = (a, b, d, c) => ((a * N1 + b) * N2 + d) * NC + c;

    const coins = new Float64Array(size), chrono = new Float64Array(size), spent = new Float64Array(size),
      refund = new Float64Array(size), score = new Float64Array(size).fill(-Infinity);
    const prev = new Int32Array(size).fill(-1), act = new Int8Array(size).fill(-1); // act: 3=церковь, 0..2=снос типа
    score[idx(0, 0, 0, 0)] = 0;

    function state(a, b, d, c) {
      const left = [n[0] - a, n[1] - b, n[2] - d];
      const dem = F.pop + left[0] * H[0].pop + left[1] * H[1].pop + left[2] * H[2].pop;
      const mf = moodFactor(S0 + c * ch.euph, dem);
      const boost = (p.cityBoost || 0) + F.boost + left[0] * H[0].boost + left[1] * H[1].boost + left[2] * H[2].boost;
      const coinMul = p.formula === 'mul' ? mf * (1 + boost) : mf + boost;
      return { left, dem, mf, coinMul, ratio: dem > 0 ? (S0 + c * ch.euph) / dem : Infinity };
    }

    let ans = null;
    const h0 = H[0], h1 = H[1], h2 = H[2];
    const cb = (p.cityBoost || 0) + F.boost, mulF = p.formula === 'mul';
    let curK = 0;
    const go = (k2, cc, chh, sp, rf, code) => {
      const sc = cc + rf - sp + W * chh;
      if (sc > score[k2] + 1e-6) { score[k2] = sc; coins[k2] = cc; chrono[k2] = chh; spent[k2] = sp; refund[k2] = rf; prev[k2] = curK; act[k2] = code; }
    };
    for (let c = 0; c < NC; c++) for (let a = 0; a < N0; a++) for (let b = 0; b < N1; b++) for (let d = 0; d < N2; d++) {
      const k = idx(a, b, d, c);
      if (score[k] === -Infinity) continue;
      curK = k;
      const l0 = n[0] - a, l1 = n[1] - b, l2 = n[2] - d;
      const dem = F.pop + l0 * h0.pop + l1 * h1.pop + l2 * h2.pop;
      const sup = S0 + c * ch.euph;
      const mf = moodFactor(sup, dem);
      const boost = cb + l0 * h0.boost + l1 * h1.boost + l2 * h2.boost;
      const coinMul = mulF ? mf * (1 + boost) : mf + boost;
      const ratio = dem > 0 ? sup / dem : Infinity;
      const free = p.freeCells + p.houseCells * (a + b + d) - c * ch.cells;

      if (ratio >= p.minRatio - 1e-9 && mf <= p.maxFactor + 1e-9) {
        const fc = coins[k] + F.base * coinMul + (l0 * h0.base + l1 * h1.base + l2 * h2.base) * coinMul;
        const fch = chrono[k] + F.chrono * mf + (l0 * h0.chrono + l1 * h1.chrono + l2 * h2.chrono) * mf;
        const rebuild = p.rebuild ? a * (h0.cost - h0.refund) + b * (h1.cost - h1.refund) + d * (h2.cost - h2.refund) : 0;
        // церкви после сбора сносятся: возврат их цены
        const net = fc + refund[k] - spent[k] + c * ch.refund - (p.rebuild ? a * h0.refund + b * h1.refund + d * h2.refund : 0) - rebuild;
        const value = net + W * fch + (p.prodMood || 0) * mf;   // производства собираются при том же настроении
        // при почти равной выгоде (разница < 1%) — вариант, где больше хроно
        const near = ans && Math.abs(value - ans.value) <= 0.01 * Math.abs(ans.value);
        if (!ans || (near ? fch > ans.chrono + 1e-6 || (Math.abs(fch - ans.chrono) <= 1e-6 && value > ans.value + 1e-6) : value > ans.value + 1e-6)) ans = { value, net, coins: fc, chrono: fch, spent: spent[k], refund: refund[k], rebuild, k, D: [a, b, d], c, s: state(a, b, d, c) };
      }

      if (c + 1 < NC && free >= ch.cells) go(idx(a, b, d, c + 1), coins[k], chrono[k], spent[k] + ch.cost, refund[k], 3);
      // снести дом игра даёт, только если свободных жителей хватает (p.popFree — свободные сейчас)
      const pf = p.popFree == null ? Infinity : p.popFree - (a * h0.pop + b * h1.pop + d * h2.pop);
      if (a < n[0] && h0.pop <= pf) go(idx(a + 1, b, d, c), coins[k] + h0.base * coinMul + c * 1e-3, chrono[k] + h0.chrono * mf, spent[k], refund[k] + h0.refund, 0);
      if (b < n[1] && h1.pop <= pf) go(idx(a, b + 1, d, c), coins[k] + h1.base * coinMul + c * 1e-3, chrono[k] + h1.chrono * mf, spent[k], refund[k] + h1.refund, 1);
      if (d < n[2] && h2.pop <= pf) go(idx(a, b, d + 1, c), coins[k] + h2.base * coinMul + c * 1e-3, chrono[k] + h2.chrono * mf, spent[k], refund[k] + h2.refund, 2);
    }
    if (!ans) return null;

    // восстановление шагов
    const raw = [];
    for (let k = ans.k; prev[k] >= 0; k = prev[k]) raw.push({ k, code: act[k], from: prev[k] });
    raw.reverse();
    const decode = (k) => { const c = k % NC; let r = (k - c) / NC; const d = r % N2; r = (r - d) / N2; const b = r % N1; const a = (r - b) / N1; return [a, b, d, c]; };
    const steps = raw.map(({ k, code, from }) => {
      const [a, b, d, c] = decode(from);
      const sBefore = state(a, b, d, c);
      const [a2, b2, d2, c2] = decode(k);
      const sAfter = state(a2, b2, d2, c2);
      if (code === 3) return { type: 'church', ratio: sAfter.ratio, mf: sAfter.mf };
      return { type: 'demolish', house: H[code].name, houseId: H[code].id, got: H[code].base * sBefore.coinMul, gotChrono: H[code].chrono * sBefore.mf, mf: sBefore.mf, ratioAfter: sAfter.ratio };
    });
    const groups = [];
    for (const s of steps) {
      const g = groups[groups.length - 1];
      if (s.type === 'demolish' && g && g.type === 'demolish') g.items.push(s);
      else groups.push(s.type === 'demolish' ? { type: 'demolish', items: [s] } : s);
    }
    const s0 = state(0, 0, 0, 0);
    const noAction = F.base * s0.coinMul + H.reduce((sum, h) => sum + h.count * h.base * s0.coinMul, 0);
    const noActionChrono = F.chrono * s0.mf + H.reduce((sum, h) => sum + h.count * h.chrono * s0.mf, 0);
    return { ...ans, steps, groups, noAction, noActionChrono, houses: H };
  }

  root.QIPlanner = { plan, moodFactor, MOOD };
  if (typeof module !== 'undefined') module.exports = root.QIPlanner;
})(typeof window !== 'undefined' ? window : globalThis);
</script>

  function openTile(t) {

  // ---------- помощник ----------
  const TYPE_OF = { bake: 'W_GuildRaidsEarlyMiddleAge_Bakery', brew: 'W_GuildRaidsLateMiddleAge_Brewery', church: 'W_GuildRaidsHighMiddleAge_Church' };
  function sync(H) { const d = sim.dump(), S = H.S; S.inQI = true; S.ready = true; S.readyAt = S.readyAt || 1; S.ents = new Map(d.ents.map((e) => [e.id, e])); S.res = d.res; S.areas = d.areas; S.blocked = d.blocked; S.expCosts = d.expCosts; S.goodsCosts = d.goodsCosts; S.impCost = d.impCost; S.me = { pid: window.qiSim.pid, name: 'я', world: 'm' }; S.ver = (S.ver || 0) + 1; }
  function exec(n, c) {

    if (['place', 'house', 'bake', 'brew', 'church'].includes(k)) { const t = n.t || (n.slot && n.slot.t) || TYPE_OF[k], sp = n.spot || n.slot; return sp ? sim.place(t, sp.x, sp.y) : 'нет места'; }
    if (k === 'demolish') { const e = sim.ents.get(id); if (e && (DEFS[e.cityentity_id] || {}).m && sim.ready(e)) sim.collect(id); return sim.demolish(id); }

    if (k === 'speed') { const e = sim.ents.get(id); return e ? speed(e) : 'нет здания'; }
    if (k === 'imp') { pay(sim.impCost); return sim.removeImpediment(id); }
    if (k === 'gexpand' && n.tile) { if (n.goods === false) pay(sim.expCosts[0] || 0); return sim.expand(n.tile.x, n.tile.y, n.goods !== false); }
    if (k === 'produce') { const e = sim.ents.get(id); if (e && /Ropery/.test(e.cityentity_id)) return sim.ropes(1); if (e && UNITS[e.cityentity_id]) { const u = UNITS[e.cityentity_id], R = sim.res; if (R.guild_raids_money < u.cm) return 'не хватает ресурсов'; R.guild_raids_money -= u.cm; R.guild_raids_supplies -= u.cs; if (/Late/.test(e.cityentity_id)) armyCan += 10; else army += 10; return null; } return 'stop'; }
    if (k === 'collect' && id != null) return sim.collect(id);
    if (k === 'collect' && !/Ждите/.test(txt)) { let m = 0; sim.ents.forEach((e) => { const d = DEFS[e.cityentity_id] || {}; if (!sim.ready(e) || UNITS[e.cityentity_id]) return; if (/молотки/.test(txt) ? d.s : /все ресурсы/.test(txt) ? true : (d.m || e.cityentity_id.startsWith('H_'))) { sim.collect(e.id); m++; } }); return m ? null : 'stop'; }

  }
  function step() {
    const H = window.foeQiHelper; if (!H || !H.step) return null;

  function readHelper() {

    if (c.mode === 'expand' && c.tiles) c.tiles.forEach((t) => rs.push({ x: t.x, y: t.y, w: 4, h: 4 }));

    box.innerHTML = '<div class="row dim"><span>' + (items ? 'Шагов подряд: ' + items.length : o.pm === 'user' ? 'Мой план' : 'Следующий шаг') + '</span><span>' + lic + '</span></div>' +
      '<div class="big">' + (n.text || '—') + '</div>' + (n.after ? '<div class="dim small">' + n.after + '</div>' : '') +
      (items ? '<ol class="small">' + items.slice(0, 8).map((it) => '<li>' + (it.text || it.kind) + '</li>').join('') + (items.length > 8 ? '<li>…</li>' : '') + '</ol>' : '') +
      '<div class="grid2">' + (wait ? '<button class="b" id="h-time">До события</button>' : '<button class="b pri" id="h-do">Сделал</button>') + '<button class="b" id="h-all">Всё подряд</button></div>';
    const hdo = $('#h-do'); if (hdo) hdo.onclick = () => act(() => { if (items) { for (const it of items) { const r = exec(it, c); if (r && r !== 'stop') return r; } return null; } const r = exec(n, c); return r === 'stop' ? 'это шаг для вас: сделайте его кнопками ниже' : r; }, 'Готово');

  function autoPlan() {

      else if (c.mode === 'expand') err = exec(n, c); else for (const it of items) { err = exec(it, c); if (err) break; }

      '<div class="list">' + list.map(([k, d]) => '<button data-t="' + k + '" class="li' + (placing === k ? ' on' : '') + '"><span>' + d.n + '</span><span class="dim">' + d.w + '×' + d.h + ' · ' + short(d.cm || 0) + (d.cc ? ' · ' + d.cc + 'х' : '') + '</span></button>').join('') + '</div>', (s) => {
      s.querySelectorAll('[data-k]').forEach((b) => b.onclick = () => { mode = b.dataset.k; placing = null; moving = null; closeSheet(); render(); toast(b.textContent + (mode === 'none' ? '' : ': тапайте по зданиям')); });

      '<div class="dim cap">СЕЗОН</div><label class="fld"><span>Конец сезона</span><input id="d-end" type="datetime-local" value="' + endS + '"></label>' + f('d-ec', 'Бонус монет, %', Math.round(opts.extC * 100)) + f('d-es', 'Бонус молотков, %', Math.round(opts.extS * 100)) +
      '<div class="dim cap">КЛЮЧ</div>' + f('d-pid', 'Номер аккаунта', opts.ownPid || '') + '<label class="fld col"><span>Ключ</span><textarea id="d-key" rows="2" placeholder="вставьте ключ"></textarea></label><div class="dim small">Своему городу нужен ключ этого аккаунта (после пробных 15 дней). Номер аккаунта — в заявке помощника в игре.</div>' +

          const ec = g('#d-ec'), es = g('#d-es'); if (isFinite(ec)) opts.extC = ec / 100; if (isFinite(es)) opts.extS = es / 100; sim.ext = { c: opts.extC, s: opts.extS };
          const ed = Date.parse(s.querySelector('#d-end').value); if (isFinite(ed)) opts.end = Math.floor(ed / 1000);

    });
  }
  document.querySelectorAll('nav button').forEach((b) => b.onclick = () => ({ time: tabTime, edit: tabEdit, data: tabData, undo: doUndo })[b.dataset.tab]());
  function doUndo() { const s = undo.pop(); if (!s) return toast('Отменять нечего'); restore(s); placing = null; moving = null; changed(); toast('Отменено'); }
  $('#zoom').onclick = () => { zoom = zoom === 1 ? 2 : 1; $('#zoom').textContent = zoom === 1 ? '＋' : '－'; sizeMap(); draw(); };
  $('#stop').onclick = () => { placing = null; moving = null; ghost = null; mode = 'none'; render(); };
  $('#ok').onclick = confirmGhost;

  let tt = null; function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => el.classList.remove('on'), 2600); }

  // ---------- верх ----------
  function render() {

    $('#clock').textContent = clock(sim.t); $('#left').textContent = 'до конца ' + Math.max(0, Math.ceil((end() - sim.t) / 86400)) + ' дн';
    $('#res').innerHTML = [['Монеты', short(R.guild_raids_money)], ['Молотки', short(R.guild_raids_supplies)], ['Хроно', fmt(R.guild_raids_chrono_alloy)], ['Осколки', fmt(R.guild_raids_currency)], ['Эйфория', isFinite(st.ratio) ? Math.round(st.ratio * 100) + '%' : '—']]
